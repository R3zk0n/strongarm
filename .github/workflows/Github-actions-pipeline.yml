name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN
permissions:
  contents: read

# Do not waste runners on stale pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code linting
    runs-on: ubuntu-latest
    # Optional: do not run lint for manual workflow_dispatch, only tests
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lint deps
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          pip install -U 'pip<23.2' wheel 'setuptools==68.2.2' 'packaging>=23.2' 'pip-tools<7.0.0'
          pip-sync requirements.txt requirements-dev.txt

      - name: Project install (invoke)
        shell: bash
        run: invoke install

      - name: Autoformat and lint
        shell: bash
        run: invoke autoformat-lint

  test_pip_sync:
    name: Test (via pip-sync and invoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        shell: bash
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcapstone4 \
            libcapstone-dev \
            sqlite3 \
            libsqlite3-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps (pip-sync)
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          pip install -U 'pip<23.2' wheel 'setuptools==68.2.2' 'packaging>=23.2' 'pip-tools<7.0.0'
          pip-sync requirements.txt requirements-dev.txt

      - name: Project install (invoke)
        shell: bash
        run: invoke install

      - name: Run tests (invoke)
        shell: bash
        run: invoke test

  test_setuptools:
    name: Test (via setuptools)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        shell: bash
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcapstone4 \
            libcapstone-dev \
            sqlite3 \
            libsqlite3-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-setuptools-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-setuptools-

      - name: Install Python tools and build deps
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          pip install -U 'pip<23.2' wheel 'setuptools==68.2.2' 'packaging>=23.2'
          pip install invoke mypy flake8 pytest pytest-xdist

      - name: Version info
        shell: bash
        run: |
          python --version
          pip --version

      - name: Install package (setuptools path)
        shell: bash
        run: pip install .

      - name: Run tests (invoke)
        shell: bash
        run: invoke test
